name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes — well inside Render's 15-min sleep window
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://thinktls-api.onrender.com/health)
          echo "Render health status: $status"
          if [ "$status" != "200" ]; then
            echo "Warning: Render returned $status"
          fi
